# A generic, single database configuration.

[alembic]

# Path to migration scripts

script_location = %(here)s/migrations

# Add current directory to Python path

prepend_sys_path = .

# Path separator

path_separator = os

# Database URL

sqlalchemy.url = sqlite:///task3.db

[post_write_hooks]

# Post-write hooks for generated migration files.

# Uncomment if you want to use Black or Ruff.

# hooks = black

# black.type = console_scripts

# black.entrypoint = black

# black.options = -l 79 REVISION_SCRIPT_FILENAME

# hooks = ruff

# ruff.type = module

# ruff.module = ruff

# ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
